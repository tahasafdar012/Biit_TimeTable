# Render Blueprint for the BIIT TimeTable API (server/ folder), free plan.
# Render dashboard -> New -> Blueprint -> pick this repo; it reads this file.
# The free plan deletes local files when the server sleeps, so the timetable is
# saved in MongoDB (free MongoDB Atlas cluster) via MONGODB_URI.
services:
  - type: web
    name: biit-timetable-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: yarn install --frozen-lockfile --production
    startCommand: yarn start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD # Render asks for these values when you create the service
        sync: false
      - key: MONGODB_URI
        sync: false
